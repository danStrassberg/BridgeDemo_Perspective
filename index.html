function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function ub64(a){var s="";for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
var f=document.getElementById('f'),btn=document.getElementById('b'),err=document.getElementById('e');
if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){
 err.textContent="This browser can't open the demo. Use a current Chrome, Edge, Firefox or Safari over https://.";btn.disabled=true;return}

async function derive(user,pw){
 var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(user.trim().toLowerCase()+"\u0000"+pw),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:ITER},base,256));
}
async function open(raw){
 var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD)); // throws on wrong key

 document.open();document.write(html);document.close();
}
